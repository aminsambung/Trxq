name: Extract TRXQ Repository

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil repository
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Siapkan ZIP
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip rsync

      - name: Ekstrak proyek
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" -type f | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "File ZIP tidak ditemukan"
            exit 1
          fi

          mkdir -p /tmp/trxq
          unzip -q "$ZIP_FILE" -d /tmp/trxq

          PROJECT_DIR=$(find /tmp/trxq \
            -name settings.gradle.kts \
            -type f \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "File proyek Gradle tidak ditemukan"
            exit 1
          fi

          echo "Proyek ditemukan: $PROJECT_DIR"

          rsync -a \
            --exclude='.github/workflows/***' \
            "$PROJECT_DIR"/ ./

      - name: Simpan hasil ekstrak
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Tidak ada perubahan untuk disimpan"
            exit 0
          fi

          git commit -m "Perbarui kode TRXQ"
          git push
